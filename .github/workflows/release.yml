name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy source
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            ./ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/ubuntu/tank-me-server/"

      - name: Configure production environment
        env:
          FIREBASE_ADMIN_KEY_BASE64: ${{ secrets.FIREBASE_ADMIN_KEY_BASE64 }}
        run: |
          {
            echo "PROFILE=Prod"
            echo "FIREBASE_EMULATION=false"
            echo "FIREBASE_AUTH_EMULATOR_HOST="
            echo "FIRESTORE_EMULATOR_HOST="
            printf 'FIREBASE_ADMIN_KEY_BASE64=%s\n' "$FIREBASE_ADMIN_KEY_BASE64"
          } | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cat > /home/ubuntu/tank-me-server/.env.production"

      - name: Install dependencies and build
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
            set -e
            export PATH="/home/ubuntu/.nvm/versions/node/v24.19.0/bin:$PATH"
            cd /home/ubuntu/tank-me-server
            npm ci
            npm run build
            npm prune --omit=dev
          EOF

      - name: Restart server
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'EOF'
            set -e
            sudo systemctl restart tank-me
            sudo systemctl is-active --quiet tank-me
          EOF

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error \
              https://server.tankme.saurabhagat.dev/__healthcheck; then
              echo
              echo "Tank Me server is healthy."
              exit 0
            fi
            echo "Health check failed, retrying in 2 seconds..."
            sleep 2
          done
          echo "Tank Me server failed health check."
          exit 1
